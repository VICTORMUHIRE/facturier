{% extends 'layout/base.html' %}
{% load static %}

{% block auth_content %}
<style>
    :root {
        --deep-blue: #0A2647;
        --royal-blue: #144272;
        --soft-blue: #E1E9F4;
        --accent-blue: #2C74B3;
    }

    body {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
    }

    .card-premium {
        border: none;
        border-radius: 24px;
        box-shadow: 0 10px 40px rgba(10, 38, 71, 0.08);
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
    }

    .form-control {
        border: 1.5px solid var(--soft-blue);
        border-radius: 12px;
        padding: 12px 16px;
        transition: all 0.3s ease;
    }

    .form-control:focus {
        border-color: var(--accent-blue);
        box-shadow: 0 0 0 4px rgba(44, 116, 179, 0.1);
    }

    .input-group-text {
        background-color: var(--soft-blue);
        border: none;
        border-radius: 12px 0 0 12px;
        color: var(--deep-blue);
        font-weight: 600;
    }

    .btn-premium {
        background: var(--deep-blue);
        color: white;
        border: none;
        border-radius: 12px;
        padding: 14px;
        font-weight: 600;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn-premium:hover {
        background: var(--royal-blue);
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(20, 66, 114, 0.3);
        color: white;
    }
</style>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-md-6 col-lg-5">
            <div class="card card-premium p-4 p-md-5">
                
                <div class="text-center mb-4">
                    <h2 class="fw-bold" style="color: var(--deep-blue);">MUHANZI FUNDI</h2>
                    <p class="text-muted small">ADMINISTRATION</p>
                </div>

                <div id="alert-container"></div>

                <form id="loginForm" method="POST">
                    {% csrf_token %}
                    
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-uppercase" style="letter-spacing: 1px;">Identifiant Téléphonique</label>
                        <div class="input-group">
                            <span class="input-group-text">+243</span>
                            <input type="tel" name="username" class="form-control" id="id_username" placeholder="8XX XXX XXX" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-bold text-uppercase" style="letter-spacing: 1px;">Mot de passe</label>
                        <div class="input-group">
                            <input type="password" name="password" class="form-control" id="id_password" required>
                            <span class="input-group-text bg-white border-start-0" id="togglePassword" style="cursor: pointer; border-radius: 0 12px 12px 0; border: 1.5px solid var(--soft-blue); border-left: none;">
                                <i class="fa fa-eye text-muted" id="toggleIcon"></i>
                            </span>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label small" for="rememberMe">Rester connecté</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-premium w-100" id="btnSubmit">
                        <span id="btnText">Se connecter</span>
                        <div class="spinner-border spinner-border-sm d-none" id="btnSpinner"></div>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    
    // Gestion de la visibilité du mot de passe
    const toggleBtn = document.getElementById('togglePassword');
    toggleBtn.addEventListener('click', function() {
        const passwordField = document.getElementById('id_password');
        const icon = document.getElementById('toggleIcon');
        if (passwordField.type === 'password') {
            passwordField.type = 'text';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
            passwordField.type = 'password';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
    });

    // Gestion de la soumission AJAX
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const btnSubmit = document.getElementById('btnSubmit');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const alertContainer = document.getElementById('alert-container');

        // UI : Loading
        btnSubmit.disabled = true;
        btnText.classList.add('d-none');
        btnSpinner.classList.remove('d-none');
        alertContainer.innerHTML = ''; 

        const username = document.getElementById('id_username').value;
        const password = document.getElementById('id_password').value;
        const csrftoken = document.querySelector('[name=csrfmiddlewaretoken]').value;

        fetch("{% url 'api_login' %}", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": csrftoken
            },
            body: JSON.stringify({
                username: `243${username}`,
                password: password
            })
        })
        .then(response => {
            if (response.ok) {
                window.location.href = "{% url 'dashboard' %}";
            } else {
                return response.json().then(data => { throw data; });
            }
        })
        .catch(error => {
            btnSubmit.disabled = false;
            btnText.classList.remove('d-none');
            btnSpinner.classList.add('d-none');

            const errorMsg = error.detail || "Erreur de connexion";
            alertContainer.innerHTML = `
                <div class="alert alert-danger d-flex align-items-center" style="border-radius: 12px; font-size: 0.9rem;">
                    <i class="fa fa-exclamation-triangle me-2"></i> ${errorMsg}
                </div>
            `;
        });
    });
});
</script>
{% endblock %}
