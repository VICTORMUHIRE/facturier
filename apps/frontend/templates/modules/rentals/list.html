{% extends 'layout/base.html' %}

{% block content %}
<div class="container-fluid py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold text-premium">Contrats de Location</h2>
        <button class="btn btn-primary rounded-pill px-4" data-bs-toggle="modal" data-bs-target="#addRentalModal">
            <i class="fa fa-file-signature me-2"></i> Nouveau Contrat
        </button>
    </div>

    <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-light">
                    <tr>
                        <th class="ps-4">Code / Matériel</th>
                        <th>Client (Membre)</th>
                        <th>Période</th>
                        <th>Jours (Ouvrables)</th>
                        <th>Total ($)</th>
                        <th>Statut</th>
                        <th class="text-end pe-4">Actions</th>
                    </tr>
                </thead>
                <tbody id="rentalTableBody">
                    </tbody>
            </table>
        </div>
    </div>
</div>

{% include 'modules/rentals/partials/_modal_add_rental.html' %}
{% endblock %}
