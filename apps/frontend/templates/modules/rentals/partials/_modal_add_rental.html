<div class="modal fade" id="addRentalModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content border-0 rounded-5 shadow-lg overflow-hidden">
            <div class="bg-primary p-4 text-white">
                <h4 class="fw-bold mb-0">Nouveau Contrat</h4>
                <p class="small opacity-75 mb-0">Configurez les dates et les conditions financières</p>
            </div>

            <form id="addRentalForm" class="p-4 bg-light">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Membre / Locataire</label>
                        <select name="member" class="form-select premium-select" id="memberSelect" required></select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Unité de Matériel (Code)</label>
                        <select name="unit" class="form-select premium-select" id="unitSelect" required></select>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Date de Début</label>
                        <input type="date" name="date_start" class="form-control premium-input" id="startDate" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Date de Fin Prévue</label>
                        <input type="date" name="date_end_expected" class="form-control premium-input" id="endDate" required>
                        <div class="form-text text-xs text-primary"><i class="fa fa-info-circle"></i> Dimanches automatiquement exclus du calcul.</div>
                    </div>

                    <hr class="my-3 opacity-10">

                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-muted text-uppercase">Réduction ($)</label>
                        <input type="number" name="discount" class="form-control border-0 shadow-sm" value="0" id="discountInput">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-muted text-uppercase">Transport ($)</label>
                        <input type="number" name="transport_fee" class="form-control border-0 shadow-sm" value="0" id="transportInput">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-bold text-muted text-uppercase">Montage ($)</label>
                        <input type="number" name="setup_fee" class="form-control border-0 shadow-sm" value="0" id="setupInput">
                    </div>

                    <div class="col-12 mt-4">
                        <div class="price-summary-card p-4 rounded-5 text-white d-flex justify-content-between align-items-center" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);">
                            <div>
                                <span class="d-block small opacity-75">Jours facturables</span>
                                <h4 class="fw-bold mb-0" id="displayDays">0 jours</h4>
                            </div>
                            <div class="text-end">
                                <span class="d-block small opacity-75">Total Final</span>
                                <h2 class="fw-black mb-0" id="displayTotal">$ 0.00</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4 d-flex justify-content-end gap-2">
                    <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Annuler</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-5 shadow">Finaliser & Imprimer</button>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .premium-input, .premium-select { border: 2px solid #fff; border-radius: 15px; padding: 12px; shadow: 0 4px 6px rgba(0,0,0,0.02); }
    .premium-input:focus { border-color: var(--bs-primary); background: #fff; }
    .price-summary-card { box-shadow: 0 15px 30px rgba(15, 23, 42, 0.2); }
</style>

<script>
    // Variable globale pour stocker le prix journalier de l'unité choisie
let selectedDailyPrice = 0;

async function refreshEstimate() {
    const startDate = document.getElementById('startDate').value;
    const endDate = document.getElementById('endDate').value;
    const discount = parseFloat(document.getElementById('discountInput').value) || 0;
    const transport = parseFloat(document.getElementById('transportInput').value) || 0;
    const setup = parseFloat(document.getElementById('setupInput').value) || 0;

    if (!startDate || !endDate || selectedDailyPrice === 0) return;

    // Appel à notre API de simulation
    const res = await fetch('/rentals/api/rentals/estimate_price/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json', 'X-CSRFToken': '{{csrf_token}}'},
        body: JSON.stringify({
            date_start: startDate,
            date_end_expected: endDate,
            daily_rate: selectedDailyPrice,
            discount: discount
        })
    });
    
    const data = await res.json();
    if (data.billable_days !== undefined) {
        document.getElementById('displayDays').innerText = `${data.billable_days} jours`;
        const totalFinal = data.estimated_total + transport + setup;
        document.getElementById('displayTotal').innerText = `$ ${totalFinal.toFixed(2)}`;
    }
}

// Écouteurs pour le calcul dynamique
document.querySelectorAll('#startDate, #endDate, #discountInput, #transportInput, #setupInput').forEach(el => {
    el.addEventListener('change', refreshEstimate);
});

// Lorsqu'on choisit un matériel, on récupère son prix journalier via son modèle parent
document.getElementById('unitSelect').addEventListener('change', async function() {
    const unitId = this.value;
    // On suppose que l'API /api/units/unitId renvoie aussi l'objet equipment avec son daily_price
    const res = await fetch(`/inventory/api/units/${unitId}/`);
    const unitData = await res.json();
    
    // On doit faire un fetch sur l'équipement pour avoir le prix
    const equipRes = await fetch(`/inventory/api/equipment/${unitData.equipment}/`);
    const equipData = await equipRes.json();
    
    selectedDailyPrice = equipData.daily_price;
    refreshEstimate();
});
</script>
