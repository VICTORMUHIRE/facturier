{% extends 'layout/base.html' %}

{% block content %}



<div class="py-4 px-md-4 animate__animated animate__fadeIn">
    
    <div class="glass-header rounded-5 p-4 mb-5 d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-4 shadow-lg border border-white">
        <div class="d-flex align-items-center gap-4">
            <div class="icon-box-premium shadow-pulse">
                <i class="fa fa-boxes-stacked text-white fa-2x"></i>
            </div>
            <div>
                <h1 class="h2 fw-black text-dark mb-0 ls-tight">Gestion du Parc</h1>
                <p class="text-muted mb-0 d-none d-md-block">Synchronisation active avec le dépôt central • <span id="lastSync" class="fw-bold">00:00</span></p>
            </div>
        </div>
        
        <div class="d-flex gap-2">
            <button class="btn btn-premium-action shadow-lg px-4 rounded-pill" data-bs-toggle="modal" data-bs-target="#addEquipmentModal">
                <i class="fa fa-plus-circle me-2"></i> Nouveau Matériel
            </button>
        </div>
    </div>

    <div class="row g-3 mb-5 align-items-center">
        <div class="col-12 col-lg-6">
            <div class="search-container-premium shadow-sm">
                <i class="fa fa-search search-icon"></i>
                <input type="text" id="inventorySearch" placeholder="Rechercher par nom, code interne ou pièce détachée..." onkeyup="filterEquipment()">
            </div>
        </div>
        <div class="col-12 col-lg-6">
            <div class="d-flex gap-2 justify-content-lg-end overflow-auto pb-2">
                <button class="filter-chip active" onclick="filterType('ALL', this)">Tous</button>
                <button class="filter-chip" onclick="filterType('SIMPLE', this)">Outils</button>
                <button class="filter-chip" onclick="filterType('COMPOUND', this)">Kits & Échafaudages</button>
            </div>
        </div>
    </div>

    <div class="row g-4" id="equipmentGrid">
        <div class="col-12 text-center py-5">
            <div class="custom-loader mx-auto"></div>
            <p class="text-muted mt-4 letter-spacing">Récupération des données sécurisées...</p>
        </div>
    </div>
</div>

{% include 'modules/inventory/partials/_modal_add_equipment.html' %}


<script>
async function loadInventory() {
    const grid = document.getElementById('equipmentGrid');
    document.getElementById('lastSync').innerText = new Date().toLocaleTimeString();

    try {
        const response = await fetch('/inventory/api/equipment/');
        const data = await response.json();
        grid.innerHTML = '';

        data.forEach(item => {
            const total = item.units.length;
            const available = item.available_count;
            const rate = total > 0 ? Math.round((available/total)*100) : 0;
            
            let color = '#22c55e'; // Vert
            if(rate < 50) color = '#f59e0b'; // Orange
            if(rate < 20) color = '#ef4444'; // Rouge

            const cardHtml = `
                <div class="col-12 col-md-6 col-xl-4 animate__animated animate__zoomIn">
                    <div class="card card-premium-inventory border-0 shadow-sm h-100">
                        <div class="p-4 d-flex justify-content-between">
                            <div class="status-ring" style="border: 4px solid ${color}; color: ${color}">
                                ${rate}%
                            </div>
                            <div class="text-end">
                                <span class="badge bg-light text-dark mb-1">${item.category === 'COMPOUND' ? 'KIT COMPLET' : 'OUTIL UNIQUE'}</span>
                                <h3 class="fw-bold mb-0 text-dark">$${item.daily_price}</h3>
                                <small class="text-muted">Par jour</small>
                            </div>
                        </div>

                        <div class="px-4 pb-2">
                            <h4 class="fw-bold text-dark mb-1">${item.name}</h4>
                            <p class="text-muted small">${item.ref_code || 'Modèle standard'}</p>
                        </div>

                        <div class="mx-4 p-3 rounded-4 bg-light d-flex justify-content-around text-center mb-3">
                            <div><div class="fw-bold text-dark">${total}</div><div class="text-xs text-muted">Total</div></div>
                            <div class="border-start border-end px-3">
                                <div class="fw-bold text-success">${available}</div><div class="text-xs text-muted">Libres</div>
                            </div>
                            <div><div class="fw-bold text-danger">${total - available}</div><div class="text-xs text-muted">Loués</div></div>
                        </div>

                        <div class="px-4 pb-4 mt-auto">
                            <div class="btn-group w-100 p-1 bg-white border rounded-pill">
                                <button class="btn btn-white border-0 rounded-pill py-2 flex-grow-1 fw-bold" onclick="toggleDetails(${item.id})">
                                    <i class="fa fa-layer-group me-1 text-primary"></i> Pièces
                                </button>
                                <button class="btn btn-dark rounded-pill py-2 flex-grow-1 shadow-sm" onclick="showUnits(${item.id})">
                                    <i class="fa fa-fingerprint me-1"></i> Gérer
                                </button>
                            </div>

                            <div id="details-${item.id}" class="d-none mt-3 animate__animated animate__fadeIn">
                                <div class="p-3 bg-light rounded-4 border-dashed">
                                    <h6 class="text-xs fw-black text-muted text-uppercase mb-2">Inventaire des pièces :</h6>
                                    ${item.components.map(c => `
                                        <div class="d-flex justify-content-between small mb-1">
                                            <span>${c.name}</span>
                                            <span class="badge bg-white text-dark shadow-sm">x${c.quantity_required}</span>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            grid.insertAdjacentHTML('beforeend', cardHtml);
        });
    } catch (error) {
        grid.innerHTML = `<div class="alert alert-danger rounded-4">Erreur de connexion serveur.</div>`;
    }
}

// Initialisation au chargement de la page
document.addEventListener('DOMContentLoaded', loadInventory);

// Petites fonctions utilitaires pour l'interactivité
function toggleDetails(id) {
    const el = document.getElementById(`details-${id}`);
    el.classList.toggle('d-none');
}

function showUnits(id) {
    Swal.fire({
        title: 'Traçabilité des Unités',
        width: '600px',
        background: 'rgba(255,255,255,0.98)',
        backdrop: 'rgba(0,0,0,0.4)',
        html: `
            <div id="unit-loader" class="py-4"><div class="spinner-border text-primary"></div></div>
            <div id="unit-container" class="row g-2 mt-3"></div>
        `,
        showConfirmButton: false,
        customClass: { popup: 'rounded-5 px-4' },
        didOpen: () => {
            fetch(`/inventory/api/equipment/${id}/`)
                .then(r => r.json())
                .then(data => {
                    const container = document.getElementById('unit-container');
                    document.getElementById('unit-loader').remove();
                    
                    data.units.forEach(u => {
                        const statusColor = u.status === 'AVAILABLE' ? 'success' : 'warning';
                        container.innerHTML += `
                            <div class="col-6">
                                <div class="unit-pill d-flex align-items-center justify-content-between p-3 rounded-4 border">
                                    <div class="text-start">
                                        <div class="text-xs text-muted">Code</div>
                                        <div class="fw-bold">${u.internal_code}</div>
                                    </div>
                                    <span class="pulse-dot bg-${statusColor}"></span>
                                </div>
                            </div>
                        `;
                    });
                });
        }
    });
}

</script>
{% endblock %}
